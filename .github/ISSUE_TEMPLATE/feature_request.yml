name: Feature request
description: Propose a focused improvement that preserves the one-file application.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Administration problem
      description: What problem should the toolkit solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the workflow, inputs, outputs, and safety controls.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: compatibility
    attributes:
      label: Project boundaries
      options:
        - label: The proposal can preserve Windows PowerShell 5.1 and PowerShell 7.x compatibility.
          required: true
        - label: The application can remain a single PowerShell script.
          required: true
