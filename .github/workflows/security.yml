name: Security Scanners

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 3"

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: security-scanners-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep PowerShell policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796 # v1.175.0
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test repository security rules
        run: >-
          semgrep --metrics=off --test
          --config .semgrep/powershell-security.yaml
          .semgrep/powershell-security.txt

      - name: Scan toolkit and release code
        id: semgrep-scan
        continue-on-error: true
        run: >-
          semgrep scan --config .semgrep/powershell-security.yaml --error --strict
          --metrics=off --jobs 2 --max-memory 4000 --timeout 10
          --sarif-output semgrep-results.sarif
          WindowsAdminToolkit.ps1 tools

      - name: Upload Semgrep results to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-powershell-policy

      - name: Preserve Semgrep results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-results-${{ github.sha }}
          path: semgrep-results.sarif
          if-no-files-found: error
          retention-days: 90

      - name: Enforce Semgrep result
        if: steps.semgrep-scan.outcome == 'failure'
        run: exit 1

  psscriptanalyzer:
    name: Scheduled PSScriptAnalyzer
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned analyzer
        shell: powershell
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -AllowClobber -Repository PSGallery

      - name: Analyze repository
        id: psscriptanalyzer-scan
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -ErrorAction Stop
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1)
          $report = @($findings | Select-Object RuleName, Severity, ScriptName, Line, Column, Message)
          ConvertTo-Json -InputObject $report -Depth 6 | Set-Content -LiteralPath psscriptanalyzer-results.json -Encoding utf8
          if ($findings.Count -gt 0) {
              $findings | Format-Table -AutoSize
              throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }

      - name: Preserve PSScriptAnalyzer results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: psscriptanalyzer-results-${{ github.sha }}
          path: psscriptanalyzer-results.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce PSScriptAnalyzer result
        if: steps.psscriptanalyzer-scan.outcome == 'failure'
        shell: pwsh
        run: exit 1

  gitleaks:
    name: Scheduled Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan history and working tree
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  required:
    name: Security scanners
    if: always()
    needs: [semgrep, psscriptanalyzer, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm scanner jobs succeeded
        env:
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          PSSCRIPTANALYZER_RESULT: ${{ needs.psscriptanalyzer.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          test "$SEMGREP_RESULT" = "success"
          test "$PSSCRIPTANALYZER_RESULT" = "success"
          test "$GITLEAKS_RESULT" = "success"
